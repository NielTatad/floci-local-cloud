# =============================================================================
# Floci Local Cloud — CI Workflow
#
# Triggers:
#   - Push to main
#   - Pull requests targeting main
#   - Manual workflow dispatch
#
# Pipeline:
#   1. Static validation
#   2. Pull and start Floci
#   3. Wait for readiness
#   4. Verify AWS CLI connectivity
#   5. Run IAM integration tests
#   6. Run S3 integration tests
#   7. Run health check
#   8. Print diagnostics on failure
#   9. Clean up CI resources
#
# Security:
#   - Minimal GitHub permissions
#   - Dummy AWS credentials only
#   - No real AWS resources provisioned
#   - Third-party actions pinned to immutable SHA refs
# =============================================================================

---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ===========================================================================
  # Job 1: Static validation
  # ===========================================================================

  validate:
    name: Static Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 1. Docker Compose validation
      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            --env-file floci/.env.example \
            --project-directory floci \
            --file floci/docker-compose.yml \
            config --quiet

          echo "Docker Compose configuration is valid."

      # 2. YAML validation
      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1

      - name: Validate YAML syntax
        run: |
          yamllint \
            --config-file .yamllint.yml \
            floci/docker-compose.yml \
            .github/workflows/ci.yml

          echo "YAML syntax is valid."

      # 3. ShellCheck
      - name: Install ShellCheck
        run: |
          SHELLCHECK_VERSION=0.10.0
          ASSET="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          MEMBER="shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

          curl -sSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${ASSET}" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "${MEMBER}"

          shellcheck --version

      - name: Lint Bash scripts
        run: |
          SCRIPTS=(
            scripts/start.sh
            scripts/stop.sh
            scripts/status.sh
            scripts/health-check.sh
            scripts/logs.sh
            scripts/backup.sh
            scripts/restore.sh
          )

          for script in "${SCRIPTS[@]}"; do
            echo "Checking ${script}"
            shellcheck --shell=bash --severity=warning "${script}"
          done

          echo "All scripts passed ShellCheck."

      # 4. Makefile validation
      - name: Validate Makefile
        run: |
          make --dry-run help > /dev/null
          echo "Makefile syntax is valid."

      # 5. Required files
      - name: Verify required files
        run: |
          REQUIRED_FILES=(
            "floci/docker-compose.yml"
            "floci/.env.example"
            "scripts/start.sh"
            "scripts/stop.sh"
            "scripts/status.sh"
            "scripts/health-check.sh"
            "scripts/logs.sh"
            "scripts/backup.sh"
            "scripts/restore.sh"
            "Makefile"
            ".gitignore"
            ".dockerignore"
            ".yamllint.yml"
            "backups/.gitkeep"
            "LICENSE"
            "README.md"
          )

          MISSING=0

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ -f "${file}" ]]; then
              echo "[ok] ${file}"
            else
              echo "[MISSING] ${file}"
              MISSING=1
            fi
          done

          if [[ "${MISSING}" -ne 0 ]]; then
            echo "Required files are missing."
            exit 1
          fi

      # 6. Script permissions
      - name: Verify script permissions
        run: |
          FAILED=0

          for script in scripts/*.sh; do
            if [[ -x "${script}" ]]; then
              echo "[ok] ${script}"
            else
              echo "[not executable] ${script}"
              FAILED=1
            fi
          done

          if [[ "${FAILED}" -ne 0 ]]; then
            echo "Run: chmod +x scripts/*.sh"
            exit 1
          fi

  # ===========================================================================
  # Job 2: Integration tests
  # ===========================================================================

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: validate

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      FLOCI_ENDPOINT: http://localhost:4566
      FLOCI_CONTAINER_NAME: floci
      FLOCI_VOLUME_NAME: floci-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 7. Pull the exact version configured in .env.example
      - name: Pull Floci Docker image
        shell: bash
        run: |
          set -euo pipefail

          FLOCI_VERSION=$(sed -n 's/^FLOCI_VERSION=//p' floci/.env.example | head -n 1 | tr -d '\r')

          if [[ -z "${FLOCI_VERSION}" ]]; then
            echo "FLOCI_VERSION is missing from floci/.env.example"
            exit 1
          fi

          echo "Using Floci version: ${FLOCI_VERSION}"

          docker pull "floci/floci:${FLOCI_VERSION}"

      # 8. Start an isolated CI Floci instance
      - name: Start Floci
        shell: bash
        run: |
          set -euo pipefail

          FLOCI_VERSION=$(sed -n 's/^FLOCI_VERSION=//p' floci/.env.example | head -n 1 | tr -d '\r')

          if [[ -z "${FLOCI_VERSION}" ]]; then
            echo "FLOCI_VERSION is missing."
            exit 1
          fi

          cat > floci/.env <<EOF
          FLOCI_VERSION=${FLOCI_VERSION}
          FLOCI_CONTAINER_NAME=floci
          FLOCI_VOLUME_NAME=floci-data
          FLOCI_HOST_PORT=4566
          FLOCI_HOSTNAME=floci
          FLOCI_STORAGE_MODE=memory
          FLOCI_DEFAULT_REGION=us-east-1
          FLOCI_DEFAULT_ACCOUNT_ID=000000000000
          FLOCI_SERVICES_S3_ENFORCE_AUTH=false
          FLOCI_NETWORK_SECURITY_GROUP_ENFORCEMENT_ENABLED=false
          FLOCI_SERVICES_UI_ENABLED=false
          EOF

          docker compose \
            --env-file floci/.env \
            --project-directory floci \
            --file floci/docker-compose.yml \
            up --detach --remove-orphans

          echo "Floci container started."

      # 9. Wait for readiness
      - name: Wait for Floci health endpoint
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=24
          ATTEMPT=0

          until [[ "${ATTEMPT}" -ge "${MAX_ATTEMPTS}" ]]; do
            ATTEMPT=$((ATTEMPT + 1))

            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 5 \
              "${FLOCI_ENDPOINT}/_floci/health" 2>/dev/null || true)

            if [[ "${HTTP_STATUS}" == "200" ]]; then
              echo "Floci is healthy after ${ATTEMPT} attempt(s)."
              exit 0
            fi

            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: HTTP ${HTTP_STATUS}"
            sleep 5
          done

          echo "Floci did not become healthy."

          docker compose \
            --env-file floci/.env \
            --project-directory floci \
            --file floci/docker-compose.yml \
            ps

          exit 1

      # 10. AWS CLI version
      - name: Verify AWS CLI v2
        run: |
          aws --version

          aws --version 2>&1 | grep -q "aws-cli/2" || {
            echo "AWS CLI v2 is required."
            exit 1
          }

      # 11. AWS connectivity
      - name: Test AWS CLI connectivity
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY=$(aws sts get-caller-identity \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --output json)

          echo "STS identity:"
          echo "${IDENTITY}"

          echo "AWS CLI connectivity confirmed."

      # 12. IAM integration test
      - name: IAM integration test — create and verify user
        shell: bash
        run: |
          set -euo pipefail

          USER_NAME="ci-test-user"

          echo "Creating IAM user: ${USER_NAME}"

          aws iam create-user \
            --user-name "${USER_NAME}" \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --output json

          echo "Verifying IAM user..."

          ACTUAL_USER=$(aws iam get-user \
            --user-name "${USER_NAME}" \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --query 'User.UserName' \
            --output text)

          if [[ "${ACTUAL_USER}" != "${USER_NAME}" ]]; then
            echo "IAM get-user verification failed."
            echo "Expected: ${USER_NAME}"
            echo "Actual: ${ACTUAL_USER}"
            exit 1
          fi

          echo "Getting IAM user list..."

          LIST_USERS_JSON=$(aws iam list-users \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --output json)

          echo "Raw ListUsers response:"
          echo "${LIST_USERS_JSON}"

          USER_COUNT=$(aws iam list-users \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --query 'length(Users)' \
            --output text)

          echo "IAM users present: ${USER_COUNT}"

          if [[ ! "${USER_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "Invalid IAM user count: ${USER_COUNT}"
            exit 1
          fi

          MATCH_COUNT=$(aws iam list-users \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --query "length(Users[?UserName=='${USER_NAME}'])" \
            --output text)

          echo "Matching CI users: ${MATCH_COUNT}"

          if [[ "${MATCH_COUNT}" != "1" ]]; then
            echo "Expected ${USER_NAME} to appear exactly once in ListUsers."
            exit 1
          fi

          echo "IAM integration test passed."

      # 13. S3 integration test
      - name: S3 integration test — create, put and get object
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_NAME="ci-test-bucket-$(date +%s)"

          echo "Creating S3 bucket: ${BUCKET_NAME}"

          aws s3api create-bucket \
            --bucket "${BUCKET_NAME}" \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --output json

          echo "Verifying S3 bucket..."

          BUCKET_COUNT=$(aws s3api list-buckets \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --query "length(Buckets[?Name=='${BUCKET_NAME}'])" \
            --output text)

          if [[ "${BUCKET_COUNT}" != "1" ]]; then
            echo "S3 bucket verification failed."
            exit 1
          fi

          echo "Creating test object..."

          echo "floci-ci-test-$(date -u +%Y%m%dT%H%M%SZ)" \
            > /tmp/ci-test-object.txt

          aws s3api put-object \
            --bucket "${BUCKET_NAME}" \
            --key "ci/test.txt" \
            --body /tmp/ci-test-object.txt \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            --output json

          echo "Retrieving test object..."

          aws s3api get-object \
            --bucket "${BUCKET_NAME}" \
            --key "ci/test.txt" \
            --endpoint-url "${FLOCI_ENDPOINT}" \
            /tmp/ci-retrieved-object.txt

          diff /tmp/ci-test-object.txt /tmp/ci-retrieved-object.txt

          echo "S3 integration test passed."

      # 14. Health check script
      - name: Run health-check.sh
        shell: bash
        run: |
          set -euo pipefail

          export FLOCI_HOST_PORT=4566
          export FLOCI_CONTAINER_NAME=floci
          export FLOCI_VOLUME_NAME=floci-data

          bash scripts/health-check.sh

      # 15. Print logs BEFORE cleanup
      - name: Print Floci logs on failure
        if: failure()
        run: |
          echo "=== Floci container status ==="

          docker compose \
            --env-file floci/.env \
            --project-directory floci \
            --file floci/docker-compose.yml \
            ps || true

          echo "=== Floci container logs ==="

          docker compose \
            --env-file floci/.env \
            --project-directory floci \
            --file floci/docker-compose.yml \
            logs --tail 200 || true

          echo "=== Docker system info ==="
          docker system df || true

      # 16. Always clean up CI resources
      - name: Clean up CI resources
        if: always()
        run: |
          echo "Stopping and removing CI Floci resources..."

          docker compose \
            --env-file floci/.env \
            --project-directory floci \
            --file floci/docker-compose.yml \
            down --volumes --remove-orphans || true

          rm -f floci/.env

          rm -f /tmp/ci-test-object.txt
          rm -f /tmp/ci-retrieved-object.txt

          echo "CI cleanup complete."
